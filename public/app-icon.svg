<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跟单打卡系统">
  <defs>
    <linearGradient id="bg" x1="60" y1="30" x2="440" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C97DC"/>
      <stop offset=".55" stop-color="#1E63AE"/>
      <stop offset="1" stop-color="#10386C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="90" y1="60" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <path d="M116 0h280a116 116 0 0 1 116 116v70C420 96 300 40 176 40 152 40 128 42 106 46A116 116 0 0 1 116 0Z" fill="url(#gloss)"/>

